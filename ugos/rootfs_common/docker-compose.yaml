# Placeholder only. scripts/build-upk.sh rewrites this tag from pyproject.toml
# before pack, together with the image tar. Do not bump it in release commits.
# The packed tag must not be latest.
services:
  octop:
    image: ghcr.io/tencentcloud/octop:0.0.0
    container_name: octop
    restart: always
    network_mode: bridge
    ports:
      - 8088:8088
    volumes:
      - ./data:/data/.octop
    environment:
      - HOME=/data
      - TZ=${TZ}
      - OCTOP_BIND_HOST=0.0.0.0
      - OCTOP_PORT=8088
      - OCTOP_DEFAULT_PASSWORD=${OCTOP_DEFAULT_PASSWORD}
      - OCTOP_ADMIN_USERNAME=${OCTOP_ADMIN_USERNAME}
      - OCTOP_ADMIN_DISPLAY_NAME=${OCTOP_ADMIN_DISPLAY_NAME}
