name: Build Octop UPK

# UGREEN UGOS Pro Docker app package pipeline.
#
# Triggered by release.yml after the v* GitHub Release exists. The workflow
# reuses the versioned GHCR image published by docker-publish.yml; it never
# rebuilds the Docker image.
on:
  workflow_dispatch:

permissions:
  contents: write
  packages: read

concurrency:
  group: build-octop-upk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  upk:
    name: Build and attach amd64 UPK
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve release version and image
        id: release
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VER="${TAG#v}"
          PROJECT_VER="$(grep -m1 '^version' pyproject.toml | sed -E 's/.*"([0-9][0-9.]*[0-9])".*/\1/')"
          if [ "$TAG" = "$VER" ] || [ "$VER" != "$PROJECT_VER" ]; then
            echo "::error::Tag ${TAG} does not match pyproject.toml version ${PROJECT_VER}."
            exit 1
          fi
          IMAGE="ghcr.io/tencentcloud/octop"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Wait for published Octop image
        env:
          IMAGE: ${{ steps.release.outputs.image }}
          VER: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          TAG="${IMAGE}:${VER}"
          echo "Waiting for ${TAG} from docker-publish.yml..."
          for i in $(seq 1 90); do
            if docker manifest inspect "$TAG" >/dev/null 2>&1; then
              echo "Image ready: $TAG"
              exit 0
            fi
            echo "[$i/90] image not ready yet"
            sleep 20
          done
          echo "::error::Timed out waiting for ${TAG}."
          exit 1

      - name: Build UPK from published image
        env:
          OCTOP_UPK_IMAGE: ${{ steps.release.outputs.image }}
          UGCLI_VERSION: 1.1.0.25
          UPK_BUILD: 1
        run: bash scripts/build-upk.sh

      - name: Require existing GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null

      - name: Attach UPK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          files: dist/Octop-ugos-amd64-*.upk
          fail_on_unmatched_files: true
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ugos-upk-${{ steps.release.outputs.version }}
          path: dist/Octop-ugos-amd64-*.upk
          if-no-files-found: error
