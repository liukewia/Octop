name: Sync Fork

on:
  schedule:
    - cron: '0 0 * * *' # Runs automatically every day at midnight UTC
  workflow_dispatch: # Allows you to trigger it manually via the Actions tab

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: main # Change this to 'master' if your default branch uses that name

      - name: Sync upstream changes
        uses: aormsby/Fork-Sync-With-Upstream-action@v3.4.3
        with:
          target_sync_branch: main # Branch in YOUR fork to update
          target_repo_token: ${{ secrets.GITHUB_TOKEN }}
          upstream_sync_branch: main # Branch in the ORIGINAL repo to pull from
          upstream_repo: TencentCloud/Octop # Replace with the actual upstream repository path
